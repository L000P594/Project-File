<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>Whack A Mole</title>
        <link rel="stylesheet" href="Style.css">
    </head>
    <body>
        <div id="newHighScore">​NEW RECORD!​</div>
        <div id="gameOver">
            <strong>GAME OVER</strong>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="closeGameOver">CLOSE</button>
        </div>
        <div class="game">
            <h1>WHACK A MOLE</h1>
            <div class="stats">
                <div>
                    <span>SCORE</span>
                    <strong id="score">0</strong>
                </div>
                <div>
                    <span>TIME</span>
                    <strong id="time">30</strong>
                </div>
                <div>
                    <span>BEST</span>
                    <strong id="highScore">0</strong>
                </div>
                <button id="resetButton">RESET</button>
            </div>
            <div class="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            </div>
            <button id="startButton">START GAME</button>
            <button id="giveUpButton">GIVE UP</button>
        </div>
        <div id="giveUp" class="popup">
            <div class="popupBox">
                <h2>Are you sure you want to give up?</h2>
                <p>Giving up will end the game and your score will be recorded.</p>
                <button id="confirmGiveUpButton">Yes, give up</button>
                <button id="cancelGiveUpButton">No, keep playing</button>
            </div>
        </div>
        <script src="Script.js"></script>
    </body>
</html>

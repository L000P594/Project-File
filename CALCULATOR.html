<!DOCTYPE html>
<html>
    <head>
        <title>CALCULATOR</title>
        <style>
            .buttons{
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            button{
                height: 60px;
                font-size: 24px;
            }
            .calculator{
                width: 300px;
                margin: auto;
            }
            #display{
                width: 100%;
                height: 60px;
                font-size: 30px;
                text-align: right;
                margin-bottom: 15px;
            }
        </style>
    </head>
    <body>
        <div class = "calculator">
            <input id = "display" readonly>
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>*</button>

            <button>C</button>
            <button>0</button>
            <button>=</button>
            <button>/</button>
        </div>
        </div>
    </body>
</html>
